<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vier gewinnt</title>
  <link rel="stylesheet" href="/web/assets/styles.css">
</head>
<body>
  <main>
    <h1>Vier gewinnt</h1>
    <nav class="tabs" aria-label="Ansichten">
      <button class="tab main-tab active" type="button" data-tab="live">Live-Spiel</button>
      <button class="tab main-tab" type="button" data-tab="training">Trainingsdaten</button>
    </nav>
    <section id="live-tab" class="tab-content active">
      <section class="panel">
        <h2>Live-Spiel</h2>
        <section class="controls" aria-label="Spieleinstellungen">
      <label>Algorithmus
        <select id="algorithm">
          <option value="minimax">Minimax</option>
          <option value="random">Random</option>
        </select>
      </label>
      <label>Schwierigkeit
        <select id="difficulty">
          <option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4" selected>4</option>
          <option value="5">5</option><option value="6">6</option>
        </select>
      </label>
      <button id="reset" type="button">Neues Spiel</button>
        </section>
        <p id="message" role="status">Du bist am Zug.</p>
        <div id="board" class="board" aria-label="Spielfeld"></div>
      </section>
    </section>
    <section id="training-tab" class="tab-content">
      <section class="panel training-panel">
      <nav class="tabs training-tabs" aria-label="Trainingsansichten">
        <button class="tab training-subtab" type="button" data-training-tab="start">Daten Generieren</button>
        <button class="tab training-subtab active" type="button" data-training-tab="view">Nachvollziehen</button>
      </nav>
      <section id="training-view-tab" class="subtab-content active">
      <div class="training-controls">
        <label>Trainingslauf
          <select id="training-run">
            <option value="">Läufe werden geladen ...</option>
          </select>
        </label>
        <label>Spiel
          <select id="training-game" disabled>
            <option value="">Zuerst einen Lauf auswählen</option>
          </select>
        </label>
      </div>
      <div id="training-config" class="config" aria-label="Trainingskonfiguration"></div>
      <div class="piece-legend" aria-label="Spielerfarben">
        <span><i class="legend-piece legend-yellow"></i> Spieler 1</span>
        <span><i class="legend-piece legend-red"></i> Spieler -1</span>
      </div>
      <div id="training-distribution" class="distribution" aria-label="Schwierigkeitsverteilung"></div>
      <div id="training-board" class="board training-board" aria-label="Trainingsbrett"></div>
      <p id="training-status" role="status">Kein Trainingslauf ausgewählt.</p>
      <div class="training-navigation">
        <button id="training-previous" type="button" disabled>Zurück</button>
        <button id="training-play" type="button" disabled>Automatisch abspielen</button>
        <button id="training-next" type="button" disabled>Weiter</button>
      </div>
      </section>
      <section id="training-start-tab" class="subtab-content">
      <form id="training-generator" class="generator" aria-label="Trainingslauf starten">
        <h3>Neuen Trainingslauf starten</h3>
        <fieldset class="form-section">
          <legend>Allgemeine Einstellungen</legend>
          <div class="generator-fields">
          <label class="generator-name">Name
          <input id="training-name" type="text" maxlength="80" value="Trainingslauf" required>
          </label>
          <label>Spiele
          <input id="training-games" type="number" min="1" max="10000" value="10" required>
          </label>
          </div>
        </fieldset>
        <fieldset class="form-section">
          <legend>Schwierigkeit</legend>
          <label>Schwierigkeitsmodus
          <select id="training-difficulty-mode">
            <option value="symmetric">Symmetrisch (beide Spieler gleich)</option>
            <option value="asymmetric">Asymmetrisch (pro Spieler)</option>
          </select>
          </label>
          <div id="training-symmetric-config" class="symmetric-config">
            <label>Min. Tiefe
              <input id="training-min-depth" type="number" min="1" max="8" value="1" required>
            </label>
            <label>Max. Tiefe
              <input id="training-max-depth" type="number" min="1" max="8" value="5" required>
            </label>
            <label>Verteilung
              <select id="training-distribution">
                <option value="uniform">Uniform</option>
                <option value="bell">Gaussian</option>
              </select>
            </label>
          </div>
          <div id="training-player-configs" class="player-configs" hidden>
          <fieldset>
            <legend>Spieler 1</legend>
            <label>Min. Tiefe
              <input id="training-player-one-min-depth" type="number" min="1" max="8" value="1">
            </label>
            <label>Max. Tiefe
              <input id="training-player-one-max-depth" type="number" min="1" max="8" value="5">
            </label>
            <label>Verteilung
              <select id="training-player-one-distribution">
                <option value="uniform">Uniform</option>
                <option value="bell">Glockenkurve</option>
              </select>
            </label>
          </fieldset>
          <fieldset>
            <legend>Spieler -1</legend>
            <label>Min. Tiefe
              <input id="training-player-minus-one-min-depth" type="number" min="1" max="8" value="1">
            </label>
            <label>Max. Tiefe
              <input id="training-player-minus-one-max-depth" type="number" min="1" max="8" value="5">
            </label>
            <label>Verteilung
              <select id="training-player-minus-one-distribution">
                <option value="uniform">Uniform</option>
                <option value="bell">Glockenkurve</option>
              </select>
            </label>
          </fieldset>
          </div>
        </fieldset>
        <fieldset class="form-section">
          <legend>Weitere Optionen</legend>
          <div class="generator-fields">
            <label>Heuristik
              <select id="training-heuristic">
                <option value="current">Aktuell</option>
                <option value="ws22_minimax">WS22 Minimax</option>
                <option value="ws22_window">WS22 Fensterbewertung</option>
              </select>
            </label>
            <label>Batchgröße
              <input id="training-batch-size" type="number" min="1" max="10000" value="100" required>
            </label>
            <label>Seed
              <input id="training-seed" type="number" placeholder="optional">
            </label>
          </div>
          <label class="checkbox-label">
            <input id="training-random-first-move" type="checkbox" checked>
            Ersten Zug zufällig wählen
          </label>
        </fieldset>
        <div class="generator-actions">
          <button type="submit" id="training-start">Trainingslauf starten</button>
          <span id="training-job-status" role="status"></span>
        </div>
      </form>
      </section>
      </section>
    </section>
  </main>
  <script src="/web/assets/app.js"></script>
</body>
</html>
